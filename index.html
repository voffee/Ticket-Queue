<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Support Ticket Queue</title>
</head>
<body>
    <div class="app-container">
        <div class="helpdesk-queue-control-panel">
            <h1>HELPDESK QUEUE</h1>
            <button>Add Ticket</button>
            <button>Undo Last</button>
            <button>Redo Last</button>

            <div id="ticket-display-open">
                <span>OPEN</span>
                <span aria-live="polite">6</span>
            </div>

            <div id="ticket-display-urgent">
                <span>URGENT</span>
                <span aria-live="assertive">1</span>
            </div>

            <label for="" class="switch"> VIEW ALL
                <input type="checkbox" id="view-all">
                <span class="slider"></span>
            </label>

            <div class="tabs">
                <div role="tablist">
                    <button role="tab" id="billing-tab" aria-controls="billing-panel" aria-selected="true" tabindex="0">Billing</button>

                    <button role="tab" id="tech-tab" aria-controls="tech-panel" aria-selected="false" tabindex="-1">Tech</button>

                    <button role="tab" id="sales-tab" aria-controls="sales-panel" aria-selected="false" tabindex="-1">Sales</button>
                </div>

                <div role="tabpanel" id="billing-panel" aria-labelledby="billing-tab">billing content here</div>
                <div role="tabpanel" id="tech-panel" aria-labelledby="tech-tab" hidden>tech content here</div>
                <div role="tabpanel" id="sales-panel" aria-labelledby="sales-tab" hidden>sales content here</div>
            </div>
        </div>
        <div class="ticket-queue-display">

        </div>
        <div class="modal-container">
            <dialog class="modal">
            </dialog>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
