<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>Support Ticket Queue</title>
</head>
<body>
    <div class="app-container">
        <div class="helpdesk-queue-control-panel">
            <h1 class="VT323-large">HELPDESK QUEUE</h1>
            <button class="add">Add Ticket</button>
            <button class="undo">Undo Last</button>
            <button class="redo">Redo Last</button>

            <div id="ticket-display-open">
                <span class="ibm-plex-mono-medium">OPEN</span>
                <span aria-live="polite" aria-label="Open tickets">6</span>
            </div>

            <div id="ticket-display-urgent">
                <span class="ibm-plex-mono-medium">URGENT</span>
                <span aria-live="assertive" aria-label="Urgent tickets">1</span>
            </div>

            <label for="view-all" class="switch ibm-plex-mono-medium"> VIEW ALL
                <input type="checkbox" id="view-all">
                <span class="slider"></span>
            </label>

            <div role="tablist">
                <button role="tab" id="billing-tab" aria-controls="billing-panel" aria-selected="true" tabindex="0">Billing</button>

                <button role="tab" id="tech-tab" aria-controls="tech-panel" aria-selected="false" tabindex="-1">Tech</button>

                <button role="tab" id="sales-tab" aria-controls="sales-panel" aria-selected="false" tabindex="-1">Sales</button>
            </div>

            <div role="tabpanel" id="billing-panel" aria-labelledby="billing-tab">
                    <div class="ticket-card">
                        <p>#01</p>
                        <p>VPN not connecting</p>
                        <p>Tech</p>
                        <p>High</p>
                    </div>
            </div>

            <div role="tabpanel" id="tech-panel" aria-labelledby="tech-tab">tech content here</div>

            <div role="tabpanel" id="sales-panel" aria-labelledby="sales-tab">sales content here</div>

        <div class="modal-container">
            <dialog class="modal">
                <form action="submit">
                    <h3>NEW TICKET</h3>

                    <label for="department">Department</label>
                    <select name="" id="department">
                        <option value="billing">Billing</option>
                        <option value="tech">Tech</option>
                        <option value="sales">Sales</option>
                    </select>

                    <label for="subject">Subject</label>
                    <input type="text" name="" id="subject" placeholder="e.g VPN not connecting">

                    <label for="priority">Priority</label>
                    <select name="" id="priority">
                        <option value="low">Low</option>
                        <option value="high">High</option>
                    </select>

                    <label for="emergency-override">Emergency Override</label>
                    <button id="emergency-override"></button>
                </form>
            </dialog>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
